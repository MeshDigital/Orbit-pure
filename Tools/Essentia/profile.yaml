# ORBIT Essentia Profile - BPM / Key / Beat-grid
# Updated: 2026-10-29
#
# BPM, key, beat positions, onset rate, danceability and the low-level spectral descriptors ORBIT
# consumes all come from the rhythm/tonal/lowlevel sections below. The bundled
# essentia_streaming_extractor_music build has no TensorFlow or Gaia support, so the previous
# `highlevel.tensorflow_models` list ran nothing and produced no "highlevel" key in the output
# (verified against the binary); genre/mood are computed in-process via ONNX Runtime instead.
# Dropping the dead model list changes no analysis result and silences the extractor's
# "Gaia library is missing" warning.

outputFormat: json
indent: 4
outputFrames: 0
sampleRate: 44100
startTime: 0
endTime: 600
analyzeSegments: false

lowlevel:
    frameSize: 2048
    hopSize: 1024

rhythm:
    minTempo: 40
    maxTempo: 208

tonal:
    frameSize: 4096
    hopSize: 2048
