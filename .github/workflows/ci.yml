name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SLSKDONET.sln

      - name: Audit dependencies for known vulnerabilities
        run: dotnet list SLSKDONET.csproj package --vulnerable --include-transitive

      - name: Build (main)
        run: dotnet build SLSKDONET.csproj -c Release --no-restore -nologo

      - name: Test (with coverage)
        run: dotnet test Tests/SLSKDONET.Tests/SLSKDONET.Tests.csproj -c Release -nologo --blame-hang-timeout 5m --logger "console;verbosity=minimal" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
